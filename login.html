<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Login | Petal &amp; Co</title>
 <link rel="stylesheet" href="css/style.css">
</head>
<body>
 <header class="topbar">
  <h1>Petal &amp; Co</h1>
  <nav><a href="index.html">Home</a><a href="login.html">Login</a><a href="signup.html">Sign up</a></nav>
 </header>
 <main class="formbox">
  <h2>Log in</h2>
  <form id="loginForm" novalidate>
   <label for="role">Role</label>
   <select id="role">
    <option value="">-- Select --</option>
    <option value="admin">Admin</option>
    <option value="customer">Customer</option>
    <option value="seller">Seller</option>
    <option value="delivery">Delivery man</option>
   </select><span class="error" id="roleErr"></span>
   <label for="email">Email</label>
   <input type="email" id="email"><span class="error" id="emailErr"></span>
   <label for="password">Password</label>
   <input type="password" id="password"><span class="error" id="passErr"></span>
   <p style="margin-top: 14px"><button type="submit" class="btn">Log in</button></p>
  </form>
  <div id="formMsg" class="notice" role="status"></div>
  <p>New here? <a href="signup.html">Create an account</a></p>
  <div class="hint">
   <strong>Demo accounts</strong><br>
   Admin: admin@flower.com / admin123<br>
   Customer: customer@flower.com / 123456<br>
   Seller: seller@flower.com / 123456<br>
   Delivery: rider@flower.com / 123456
  </div>
 </main>
 <script src="js/data.js"></script>
 <script src="js/storage.js"></script>
 <script src="js/validation.js"></script>
 <script src="js/auth.js"></script>
</body>
</html>
